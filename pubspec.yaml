name: onetap
description: "OneTap Journal - Track your mood in one tap."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.2.0
  flutter_timezone: ^3.0.1
  google_fonts: ^8.0.0
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  timezone: ^0.10.0
  lottie: ^3.3.1
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  video_player: ^2.10.1
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/animation/Mood 1/
    - assets/animation/Mood 2/
    - assets/animation/Mood 3/
    - assets/animation/Mood 4/
    - assets/animation/Mood 5/
    - assets/animation/Mood 6/
    - assets/intro/


# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

